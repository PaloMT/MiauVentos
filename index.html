<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Imprescindible para que se adapte al ancho del móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos cerca de ti</title>

   <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-movil">
    
    <!-- Cabecera con título y botón de búsqueda -->
    <header class="cabecera">
      <h1>Explorar eventos</h1>
      <button id="btn-abrir-filtros" class="boton-busqueda">
        🔍 Buscar o filtrar eventos...
      </button>
    </header>

    <!-- Contenido principal con tarjetas de ejemplo -->
    <main class="lista-eventos">

      <article class="tarjeta">
        <p class="fecha">Sábado · 19:00</p>
        <h2>Concierto acústico en la terraza</h2>
        <p class="lugar">Centro Cultural · Madrid</p>
        <div class="detalles">
          <span class="dato">15 €</span>
          <span class="dato">1,8 km</span>
          <span class="dato">2 h</span>
        </div>
      </article>

      <article class="tarjeta">
        <p class="fecha">Domingo · 10:30</p>
        <h2>Ruta guiada por el parque</h2>
        <p class="lugar">Parque del Retiro</p>
        <div class="detalles">
          <span class="dato">Gratis</span>
          <span class="dato">3,2 km</span>
          <span class="dato">1,5 h</span>
        </div>
      </article>

    </main>

  </div>
  <script>
    const params = new URLSearchParams({ categoria: "musica", precio_max: 20 });
    const res = await fetch(`http://127.0.0.1:8000/api/eventos?${params}`);
    const { total, eventos } = await res.json();
  </script>
</body>
</html>
