<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos cerca de ti</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app-movil">

    <header class="cabecera">
      <h1>Explorar eventos en Madrid</h1>
      <button id="btn-abrir-filtros" class="boton-busqueda">
        Buscar o filtrar eventos...
        <span id="icono-flecha">▼</span>
      </button>
    </header>

    <!-- FILTROS -->
    <div id="panel-filtros" class="panel-filtros oculto">

      <!-- Categoría (se rellena desde la API) -->
      <!-- Categoría -->
      <div class="grupo-filtro">
        <label>Categoría</label>
        <div class="desplegable-categoria" id="desplegable-categoria">
          <input type="hidden" id="filtro-categoria" value="">

          <button type="button" id="btn-toggle-categoria" class="btn-select-categoria">
            <span id="texto-categoria">Todas</span>
            <span id="flecha-categoria">▼</span>
          </button>

          <div id="menu-categorias" class="menu-categorias oculto">
            <button type="button" class="btn-opcion-cat activo" data-valor="">Todas</button>
            <button type="button" class="btn-opcion-cat" data-valor="musica">Música</button>
            <button type="button" class="btn-opcion-cat" data-valor="deporte">Deporte</button>
            <button type="button" class="btn-opcion-cat" data-valor="teatro">Teatro</button>
            <button type="button" class="btn-opcion-cat" data-valor="arte">Arte</button>
            <button type="button" class="btn-opcion-cat" data-valor="gastronomia">Gastronomía</button>
            <button type="button" class="btn-opcion-cat" data-valor="cine">Cine</button>
            <button type="button" class="btn-opcion-cat" data-valor="tecnologia">Tecnología</button>
            <button type="button" class="btn-opcion-cat" data-valor="aire-libre">Aire libre</button>
            <button type="button" class="btn-opcion-cat" data-valor="talleres">Talleres</button>
            <button type="button" class="btn-opcion-cat" data-valor="fiesta">Fiesta</button>
            <button type="button" class="btn-opcion-cat" data-valor="familia">Familia</button>
          </div>
        </div>
      </div>

      <!-- Hora de inicio -->
      <div class="grupo-filtro">
        <label for="filtro-hora">Empieza a partir de las</label>
        <input type="time" id="filtro-hora">
      </div>

      <!-- Precio -->
      <div class="grupo-filtro">
        <label for="filtro-precio">
          Precio máximo
          <span id="valor-precio">Cualquiera</span>
        </label>
        <input type="range" id="filtro-precio" min="0" max="50" step="5" value="50">
      </div>

      <!-- Distancia -->
      <div class="grupo-filtro">
        <label for="filtro-distancia">
          Distancia máxima
          <span id="valor-distancia">Cualquiera</span>
        </label>
        <input type="range" id="filtro-distancia" min="1" max="20" step="1" value="20">
      </div>

      <!-- Duración -->
      <div class="grupo-filtro">
        <label for="filtro-duracion">
          Duración máxima
          <span id="valor-duracion">Cualquiera</span>
        </label>
        <input type="range" id="filtro-duracion" min="0.5" max="5" step="0.5" value="5">
      </div>

      <button id="btn-aplicar" class="boton-aplicar" type="button">
        Aplicar filtros
      </button>

    </div>

    <!-- Contenido principal con tarjetas de ejemplo -->
    <main class="lista-eventos" id="lista-eventos">
      <div id="sin-resultados" class="sin-resultados oculto">
        <p>No hay eventos con esos filtros.</p>
      </div>
    </main>

    <button id="btn-mas" class="boton-aplicar oculto" type="button">Mostrar más</button>

  </div>

  </div>
  <script src="script_backend.js"></script>
  <script src="script.js"></script>
</body>

</html>
