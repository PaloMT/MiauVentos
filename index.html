<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Imprescindible para que se adapte al ancho del móvil -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventos cerca de ti</title>

  <style>
    /* 1. Reinicio básico de márgenes */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f3f4f6;
      color: #1f2937;
    }

    /* 2. Contenedor principal estilo app móvil */
    .app-movil {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      background-color: #ffffff;
    }

    /* 3. Cabecera fija arriba */
    .cabecera {
      position: sticky;
      top: 0;
      background-color: #ffffff;
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .cabecera h1 {
      font-size: 20px;
      margin-bottom: 12px;
      color: #111827;
    }

    /* Botón que abrirá la pestaña de filtros */
    .boton-busqueda {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background-color: #f9fafb;
      color: #4b5563;
      font-size: 15px;
      text-align: left;
      cursor: pointer;
    }

    /* 4. Lista y tarjetas de eventos */
    .lista-eventos {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tarjeta {
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 16px;
      background-color: #ffffff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
    }

    .tarjeta .fecha {
      font-size: 13px;
      color: #4f46e5;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .tarjeta h2 {
      font-size: 18px;
      margin-bottom: 4px;
    }

    .tarjeta .lugar {
      font-size: 14px;
      color: #6b7280;
    }

    /* Píldoras con precio, distancia y duración */
    .detalles {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .dato {
      background-color: #eef2ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-movil">
    
    <!-- Cabecera con título y botón de búsqueda -->
    <header class="cabecera">
      <h1>Explorar eventos</h1>
      <button id="btn-abrir-filtros" class="boton-busqueda">
        🔍 Buscar o filtrar eventos...
      </button>
    </header>

    <!-- Contenido principal con tarjetas de ejemplo -->
    <main class="lista-eventos">

      <article class="tarjeta">
        <p class="fecha">Sábado · 19:00</p>
        <h2>Concierto acústico en la terraza</h2>
        <p class="lugar">Centro Cultural · Madrid</p>
        <div class="detalles">
          <span class="dato">15 €</span>
          <span class="dato">1,8 km</span>
          <span class="dato">2 h</span>
        </div>
      </article>

      <article class="tarjeta">
        <p class="fecha">Domingo · 10:30</p>
        <h2>Ruta guiada por el parque</h2>
        <p class="lugar">Parque del Retiro</p>
        <div class="detalles">
          <span class="dato">Gratis</span>
          <span class="dato">3,2 km</span>
          <span class="dato">1,5 h</span>
        </div>
      </article>

    </main>

  </div>

</body>
</html>
